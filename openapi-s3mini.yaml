openapi: 3.0.3
info:
  title: S3MINI S3-Compatible API
  version: 0.1.0
  description: |
    API contract for the currently implemented S3MINI subset. Metadata is stored in
    /data/s3mini.sqlite. Access-key control-plane endpoints require the S3MINI_ADMIN_TOKEN bearer
    token. Local replication intent is journaled, but peer transport is not exposed in this S3
    API yet. The complete AWS feature matrix and implementation status are documented in
    docs/feature-catalog.md.
servers:
  - url: http://localhost:9000
security:
  - {}
paths:
  /admin:
    get:
      operationId: AdminDashboard
      tags: [Admin]
      responses:
        '200':
          description: Lightweight access-key management dashboard.
          content:
            text/html: { schema: { type: string } }
  /admin/access-keys:
    get:
      operationId: ListAccessKeys
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Active and disabled access keys without secret material.
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AccessKey' } } }
        '403': { $ref: '#/components/responses/S3Error' }
    post:
      operationId: CreateAccessKey
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { displayName: { type: string } } }
      responses:
        '201':
          description: Created credentials. The secret is returned only in this response.
          content:
            application/json: { schema: { $ref: '#/components/schemas/IssuedAccessKey' } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/access-keys/{accessKeyId}:
    delete:
      operationId: DisableAccessKey
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters:
        - name: accessKeyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Access key disabled. }
        '403': { $ref: '#/components/responses/S3Error' }
  /:
    get:
      operationId: ListBuckets
      tags: [Buckets]
      responses:
        '200':
          description: Buckets owned by the caller.
          content:
            application/xml:
              schema:
                type: string
  /{bucket}:
    put:
        operationId: CreateBucket
        tags: [Buckets]
        parameters:
          - $ref: '#/components/parameters/Bucket'
          - $ref: '#/components/parameters/LocationConstraint'
          - $ref: '#/components/parameters/Lifecycle'
          - $ref: '#/components/parameters/Policy'
          - $ref: '#/components/parameters/ACL'
        responses:
          '200': { description: Bucket created. }
          '409': { $ref: '#/components/responses/S3Error' }
    head:
        operationId: HeadBucket
        tags: [Buckets]
        parameters: [{ $ref: '#/components/parameters/Bucket' }]
        responses:
          '200': { description: Bucket exists. }
          '404': { $ref: '#/components/responses/S3Error' }
    delete:
        operationId: DeleteBucket
        tags: [Buckets]
        parameters: [{ $ref: '#/components/parameters/Bucket' }]
        responses:
          '204': { description: Bucket deleted. }
          '409': { $ref: '#/components/responses/S3Error' }
    get:
        operationId: ListObjectsV2
        tags: [Objects]
        parameters:
          - $ref: '#/components/parameters/Bucket'
          - $ref: '#/components/parameters/Prefix'
          - $ref: '#/components/parameters/Lifecycle'
          - $ref: '#/components/parameters/Policy'
          - $ref: '#/components/parameters/ACL'
          - $ref: '#/components/parameters/EncodingType'
        responses:
          '200':
            description: Objects in the bucket.
            content:
              application/xml:
                schema: { type: string }
          '404': { $ref: '#/components/responses/S3Error' }
  /{bucket}/{key}:
    parameters:
      - $ref: '#/components/parameters/Bucket'
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: Object key, including slash-separated prefixes.
    put:
      operationId: PutObject
      tags: [Objects]
      parameters:
         - $ref: '#/components/parameters/StorageClass'
         - $ref: '#/components/parameters/ACL'
         - { name: Content-Disposition, in: header, schema: { type: string } }
         - { name: Content-Language, in: header, schema: { type: string } }
         - { name: Content-MD5, in: header, schema: { type: string }, description: Base64 MD5 digest validated when supplied. }
         - { name: x-amz-content-sha256, in: header, schema: { type: string }, description: Hex SHA-256 payload digest or UNSIGNED-PAYLOAD. }
         - { name: x-bz-content-sha1, in: header, schema: { type: string }, description: Hex SHA-1 payload digest or do_not_verify. }
        - { name: Content-Encoding, in: header, schema: { type: string } }
        - { name: Cache-Control, in: header, schema: { type: string } }
        - { name: Expires, in: header, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Object stored.
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/S3Error' }
    get:
      operationId: GetObject
      tags: [Objects]
      responses:
        '200':
          description: Object contents.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/S3Error' }
    head:
      operationId: HeadObject
      tags: [Objects]
      responses:
        '200':
          description: Object metadata.
          headers:
            ETag: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
        '404': { $ref: '#/components/responses/S3Error' }
    delete:
      operationId: DeleteObject
      tags: [Objects]
      responses:
        '204': { description: Object deleted. }
        '404': { $ref: '#/components/responses/S3Error' }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Value of the S3MINI_ADMIN_TOKEN environment variable.
  schemas:
    AccessKey:
      type: object
      required: [accessKeyId, displayName, status, createdAt]
      properties:
        accessKeyId: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Active, Disabled] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    IssuedAccessKey:
      allOf:
        - $ref: '#/components/schemas/AccessKey'
        - type: object
          required: [secretAccessKey]
          properties:
            secretAccessKey: { type: string }
  parameters:
    Bucket:
      name: bucket
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 63 }
    Prefix:
      name: prefix
      in: query
      schema: { type: string }
    LocationConstraint:
      name: locationConstraint
      in: query
      schema: { type: string, default: us-east-1 }
    StorageClass:
      name: x-amz-storage-class
      in: header
       schema: { type: string, enum: [STANDARD, STANDARD_IA, ONEZONE_IA, INTELLIGENT_TIERING, GLACIER, DEEP_ARCHIVE, GLACIER_IR], default: STANDARD }
    Lifecycle:
      name: lifecycle
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve lifecycle rules. PUT accepts AWS-style XML or JSON; processing is lazy and occurs during object reads and listings.
    Policy:
      name: policy
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve the bucket policy.
    ACL:
      name: acl
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve the bucket or object ACL. Object ACL bodies may use canned ACLs or XML AccessControlPolicy grants; authorization support is partial.
    EncodingType:
      name: encoding-type
      in: query
      required: false
      schema: { type: string, enum: [url] }
      description: URL-encode object keys and common prefixes in ListObjectsV2 responses.
  responses:
    S3Error:
      description: S3-compatible XML error.
      content:
        application/xml:
          schema: { type: string }
