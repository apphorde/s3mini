openapi: 3.0.3
info:
  title: S3MINI S3-Compatible API
  version: 0.1.0
  description: |
    API contract for the currently implemented S3MINI subset. Metadata is stored in
    /data/s3mini.sqlite. Access-key control-plane endpoints require the S3MINI_ADMIN_TOKEN bearer
    token. Local replication intent is journaled, but peer transport is not exposed in this S3
    API yet. The complete AWS feature matrix and implementation status are documented in
    docs/feature-catalog.md.
servers:
  - url: http://localhost:9000
security:
  - {}
paths:
  /admin:
    get:
      operationId: AdminDashboard
      tags: [Admin]
      responses:
        '200':
          description: Lightweight access-key management dashboard.
          content:
            text/html: { schema: { type: string } }
  /admin/access-keys:
    get:
      operationId: ListAccessKeys
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Active and disabled access keys without secret material.
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AccessKey' } } }
        '403': { $ref: '#/components/responses/S3Error' }
    post:
      operationId: CreateAccessKey
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { displayName: { type: string } } }
      responses:
        '201':
          description: Created credentials. The secret is returned only in this response.
          content:
            application/json: { schema: { $ref: '#/components/schemas/IssuedAccessKey' } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/access-keys/{accessKeyId}:
    delete:
      operationId: DisableAccessKey
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters:
        - name: accessKeyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Access key disabled. }
        '403': { $ref: '#/components/responses/S3Error' }
  /internal/replication:
    put:
      operationId: ReplicateEvent
      tags: [Internal]
      description: Internal authenticated asynchronous object and delete-event delivery. For delete events, the request body is omitted. Nodes may use private VPN endpoints for transport; this endpoint remains token-authenticated. Not part of the public S3 API.
      parameters:
        - { name: x-s3mini-replication-token, in: header, required: true, schema: { type: string } }
        - { name: x-s3mini-bucket, in: header, required: true, schema: { type: string } }
        - { name: x-s3mini-key, in: header, required: true, schema: { type: string } }
         - { name: x-s3mini-version-id, in: header, required: true, schema: { type: string } }
         - { name: x-s3mini-operation, in: header, required: true, schema: { type: string, enum: [PutObject, DeleteObject] } }
         - { name: x-s3mini-delete-marker, in: header, required: true, schema: { type: boolean } }
          - { name: x-s3mini-etag, in: header, required: false, schema: { type: string } }
          - { name: x-s3mini-sha256, in: header, required: false, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
        - { name: x-s3mini-last-modified, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
         required: false
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
         '204': { description: Replication event accepted. }
         '403': { $ref: '#/components/responses/S3Error' }
  /internal/replication/inventory:
    get:
      operationId: GetReplicationInventory
      tags: [Internal]
      description: Internal authenticated inventory of object versions and tombstones for anti-entropy comparison.
      parameters:
        - { name: x-s3mini-replication-token, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: Object/version inventory.
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReplicationInventoryItem' } } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/replication/health:
    get:
      operationId: GetReplicationHealth
      tags: [Admin]
      description: Authenticated control-plane view of configured peer health.
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Peer health states.
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PeerHealth' } } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/replication/summary:
    get:
      operationId: GetReplicationSummary
      tags: [Admin]
      description: Authenticated replication quorum and degraded-state summary.
      security: [{ AdminBearer: [] }]
      responses:
        '200': { description: Replication summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReplicationSummary' } } } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/replication/events:
    get:
      operationId: ListReplicationEvents
      tags: [Admin]
      description: Authenticated list of durable replication events, including dead-letter events.
      security: [{ AdminBearer: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [Pending, Delivered, Failed, DeadLetter] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Replication events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReplicationEvent' } } } } }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/replication/events/{id}/retry:
    post:
      operationId: RetryDeadLetterEvent
      tags: [Admin]
      description: Requeues a dead-letter replication event for delivery.
      security: [{ AdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Event requeued. }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/buckets:
    get:
      operationId: ListAdminBuckets
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      responses:
        '200': { description: Managed buckets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminBucket' } } } } }
    post:
      operationId: CreateAdminBucket
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdminBucket' } } } }
      responses:
        '201': { description: Bucket created. }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/buckets/{bucket}:
    delete:
      operationId: DeleteAdminBucket
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Bucket' }]
      responses:
        '204': { description: Bucket deleted. }
        '403': { $ref: '#/components/responses/S3Error' }
  /admin/buckets/{bucket}/policy:
    get:
      operationId: GetAdminBucketPolicy
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Bucket' }]
      responses:
        '200': { description: Bucket policy, content: { application/json: { schema: { type: object } } } }
    put:
      operationId: PutAdminBucketPolicy
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Bucket' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '204': { description: Policy saved. }
    delete:
      operationId: DeleteAdminBucketPolicy
      tags: [Admin]
      security: [{ AdminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Bucket' }]
      responses:
        '204': { description: Policy deleted. }
  /admin/login:
    get:
      operationId: StartAdminOidcLogin
      tags: [Admin]
      description: Starts the configured PKCE OIDC login flow for the dashboard.
      responses:
        '302': { description: Redirect to the OIDC authorization endpoint. }
  /admin/callback:
    get:
      operationId: CompleteAdminOidcLogin
      tags: [Admin]
      description: Exchanges the OIDC authorization code and establishes the dashboard session cookie.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect to the dashboard. }
  /admin/logout:
    post:
      operationId: LogoutAdminOidc
      tags: [Admin]
      responses:
        '204': { description: Dashboard session cleared. }
  /:
    get:
      operationId: ListBuckets
      tags: [Buckets]
      responses:
        '200':
          description: Buckets owned by the caller.
          content:
            application/xml:
              schema:
                type: string
  /{bucket}:
    put:
        operationId: CreateBucket
        tags: [Buckets]
        parameters:
          - $ref: '#/components/parameters/Bucket'
          - $ref: '#/components/parameters/LocationConstraint'
          - $ref: '#/components/parameters/Lifecycle'
          - $ref: '#/components/parameters/Policy'
          - $ref: '#/components/parameters/ACL'
        responses:
          '200': { description: Bucket created. }
          '409': { $ref: '#/components/responses/S3Error' }
    head:
        operationId: HeadBucket
        tags: [Buckets]
        parameters: [{ $ref: '#/components/parameters/Bucket' }]
        responses:
          '200': { description: Bucket exists. }
          '404': { $ref: '#/components/responses/S3Error' }
    delete:
        operationId: DeleteBucket
        tags: [Buckets]
        parameters: [{ $ref: '#/components/parameters/Bucket' }]
        responses:
          '204': { description: Bucket deleted. }
          '409': { $ref: '#/components/responses/S3Error' }
    get:
        operationId: ListObjectsV2
        tags: [Objects]
        parameters:
          - $ref: '#/components/parameters/Bucket'
          - $ref: '#/components/parameters/Prefix'
          - $ref: '#/components/parameters/Lifecycle'
          - $ref: '#/components/parameters/Policy'
          - $ref: '#/components/parameters/ACL'
          - $ref: '#/components/parameters/EncodingType'
        responses:
          '200':
            description: Objects in the bucket.
            content:
              application/xml:
                schema: { type: string }
          '404': { $ref: '#/components/responses/S3Error' }
  /{bucket}/{key}:
    parameters:
      - $ref: '#/components/parameters/Bucket'
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: Object key, including slash-separated prefixes.
    put:
      operationId: PutObject
      tags: [Objects]
      parameters:
         - $ref: '#/components/parameters/StorageClass'
         - $ref: '#/components/parameters/ACL'
         - { name: Content-Disposition, in: header, schema: { type: string } }
         - { name: Content-Language, in: header, schema: { type: string } }
         - { name: Content-MD5, in: header, schema: { type: string }, description: Base64 MD5 digest validated when supplied. }
         - { name: x-amz-content-sha256, in: header, schema: { type: string }, description: Hex SHA-256 payload digest or UNSIGNED-PAYLOAD. }
         - { name: x-bz-content-sha1, in: header, schema: { type: string }, description: Hex SHA-1 payload digest or do_not_verify. }
        - { name: Content-Encoding, in: header, schema: { type: string } }
        - { name: Cache-Control, in: header, schema: { type: string } }
        - { name: Expires, in: header, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Object stored.
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/S3Error' }
    get:
      operationId: GetObject
      tags: [Objects]
      responses:
        '200':
          description: Object contents.
          headers:
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/S3Error' }
    head:
      operationId: HeadObject
      tags: [Objects]
      responses:
        '200':
          description: Object metadata.
          headers:
            ETag: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
        '404': { $ref: '#/components/responses/S3Error' }
    delete:
      operationId: DeleteObject
      tags: [Objects]
      responses:
        '204': { description: Object deleted. }
        '404': { $ref: '#/components/responses/S3Error' }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Value of the S3MINI_ADMIN_TOKEN environment variable.
  schemas:
    AccessKey:
      type: object
      required: [accessKeyId, displayName, status, createdAt]
      properties:
        accessKeyId: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [Active, Disabled] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    IssuedAccessKey:
      allOf:
        - $ref: '#/components/schemas/AccessKey'
        - type: object
          required: [secretAccessKey]
         properties:
             secretAccessKey: { type: string }
    AdminBucket:
      type: object
      required: [name, creationDate]
      properties:
        name: { type: string }
        creationDate: { type: string, format: date-time }
        locationConstraint: { type: string }
    CreateAdminBucket:
      type: object
      required: [name]
      properties:
        name: { type: string }
        locationConstraint: { type: string }
    ReplicationInventoryItem:
      type: object
      required: [bucket, key, versionId, etag, sha256, size, lastModified, deleteMarker]
      properties:
        bucket: { type: string }
        key: { type: string }
        versionId: { type: string }
        etag: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, format: int64 }
        lastModified: { type: string, format: date-time }
         deleteMarker: { type: boolean }
    ReplicationEvent:
      type: object
      required: [id, bucket, key, versionId, operation, sourceNodeId, status, attempts, createdAt]
      properties:
        id: { type: integer, format: int64 }
        bucket: { type: string }
        key: { type: string }
        versionId: { type: string }
        operation: { type: string, enum: [PutObject, DeleteObject] }
        sourceNodeId: { type: string }
        payloadPath: { type: string }
        etag: { type: string }
        size: { type: integer, format: int64 }
        deleteMarker: { type: boolean }
        status: { type: string, enum: [Pending, Delivered, Failed, DeadLetter] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PeerHealth:
      type: object
      required: [peer, status, consecutiveFailures]
      properties:
        peer: { type: string }
        status: { type: string, enum: [Healthy, Unhealthy, Unknown] }
        consecutiveFailures: { type: integer }
        lastSuccessAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
    ReplicationSummary:
      type: object
      required: [configuredPeers, quorum, healthyPeers, unhealthyPeers, unknownPeers, degraded, events]
      properties:
        configuredPeers: { type: integer }
        quorum: { type: integer }
        healthyPeers: { type: integer }
        unhealthyPeers: { type: integer }
        unknownPeers: { type: integer }
        degraded: { type: boolean }
        events: { type: object, additionalProperties: { type: integer } }
  parameters:
    Bucket:
      name: bucket
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 63 }
    Prefix:
      name: prefix
      in: query
      schema: { type: string }
    LocationConstraint:
      name: locationConstraint
      in: query
      schema: { type: string, default: us-east-1 }
    StorageClass:
      name: x-amz-storage-class
      in: header
       schema: { type: string, enum: [STANDARD, STANDARD_IA, ONEZONE_IA, INTELLIGENT_TIERING, GLACIER, DEEP_ARCHIVE, GLACIER_IR], default: STANDARD }
    Lifecycle:
      name: lifecycle
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve lifecycle rules. PUT accepts AWS-style XML or JSON; processing is lazy and occurs during object reads and listings.
    Policy:
      name: policy
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve the bucket policy.
    ACL:
      name: acl
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Configure or retrieve the bucket or object ACL. Object ACL bodies may use canned ACLs or XML AccessControlPolicy grants; authorization support is partial.
    EncodingType:
      name: encoding-type
      in: query
      required: false
      schema: { type: string, enum: [url] }
      description: URL-encode object keys and common prefixes in ListObjectsV2 responses.
  responses:
    S3Error:
      description: S3-compatible XML error.
      content:
        application/xml:
          schema: { type: string }
